name: Windows 11 build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # CMakePresets.json uses Ninja. The image usually ships it, but checking
      # keeps the failure readable instead of a bare "ninja was not found".
      - name: Ensure Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "ninja could not be installed" }
          }
          ninja --version

      # No hand-built Lua any more: USE_SYSTEM_LUA is OFF and cmake/lua.cmake
      # vendors Lua 5.4.6, the same source the local presets use.
      - name: Configure through the windows-release preset
        shell: pwsh
        run: |
          cmake --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build app and tests
        shell: pwsh
        run: |
          cmake --build --preset windows-release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run C++ tests
        shell: pwsh
        run: |
          ctest --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble portable app
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "package-windows"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "build/windows-release/nuc_app.exe" $stage
          Copy-Item "config.toml" $stage
          Copy-Item "data" $stage -Recurse
          Copy-Item "mods" $stage -Recurse
          Copy-Item "scripts" $stage -Recurse
          @"
          Nuc-lVuc-l portable build
          =========================

          Run nuc_app.exe from this folder. Keep data, mods, scripts and config.toml
          beside the executable. The current renderer draws the generated voxel world with a free-fly camera. This is an early renderer milestone, not a finished game.

          "@ | Set-Content (Join-Path $stage "RUN-ME.txt")
          Compress-Archive -Path "$stage/*" -DestinationPath "Nuc-lVuc-l-Windows-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Nuc-lVuc-l-Windows-x64
          path: Nuc-lVuc-l-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      # The installer is built only after the tests above passed, so a red test
      # never publishes a new setup program. Inno Setup is not on windows-2022.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
          )
          $find = { $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { Write-Warning "choco install innosetup failed, falling back to the official installer" }
            $iscc = & $find
          }
          if (-not $iscc) {
            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Invoke-WebRequest "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe" -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
            $iscc = & $find
          }
          if (-not $iscc) { throw "ISCC.exe was not found in any known location" }
          "Using $iscc"
          (Get-Item $iscc).VersionInfo.ProductVersion

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.1.0.${{ github.run_number }}"
          $stage = Join-Path $PWD "package-windows"
          $out = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $out | Out-Null
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found" }
          & $iscc "/DStageDir=$stage" "/DAppVersion=$version" "/DOutDir=$out" "installer\vcv.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }
          $installer = Join-Path $out "V-C-V-Setup-x64.exe"
          if (-not (Test-Path $installer)) { throw "installer was not produced" }
          $item = Get-Item $installer
          "Installer: $($item.FullName) ($([math]::Round($item.Length / 1MB, 1)) MB, version $version)"
          $item.VersionInfo | Format-List FileVersion, ProductVersion | Out-String | Write-Host

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: V-C-V-Installer-Windows-x64
          path: dist/V-C-V-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      # Producing a file is not the same as producing a usable installer, so the
      # runner installs it silently and then uninstalls it again.
      - name: Smoke-install the produced installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "vcv-install-check"
          $log = Join-Path $env:RUNNER_TEMP "vcv-install.log"
          $setup = Join-Path $PWD "dist/V-C-V-Setup-x64.exe"
          $proc = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=$target", "/LOG=$log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "installer exited with code $($proc.ExitCode)"
          }
          $exe = Join-Path $target "nuc_app.exe"
          if (-not (Test-Path $exe)) { throw "nuc_app.exe is missing after installation" }
          "Installed $((Get-ChildItem $target -Recurse -File).Count) files into $target"
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "uninstaller was not installed" }
          $removal = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($removal.ExitCode -ne 0) { throw "uninstaller exited with code $($removal.ExitCode)" }
          if (Test-Path $exe) { throw "uninstaller left nuc_app.exe behind" }
          "Installer smoke test passed: install and uninstall are clean"
