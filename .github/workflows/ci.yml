name: CMake CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # liblua5.4-dev is deliberately absent: USE_SYSTEM_LUA is OFF and the tree
      # vendors Lua 5.4.6 through cmake/lua.cmake, so a system Lua would only
      # hide a broken vendored download.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ git libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
      - name: Configure through the debug preset
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --parallel 2
      - name: Verify incremental Ninja rebuild under 20 seconds
        shell: bash
        run: |
          touch world/raycast.cpp
          start_ns=$(date +%s%N)
          cmake --build --preset debug --parallel 2
          elapsed_ms=$(( ($(date +%s%N) - start_ns) / 1000000 ))
          echo "Incremental Ninja rebuild: ${elapsed_ms} ms"
          if [ "$elapsed_ms" -ge 20000 ]; then
            echo "Incremental rebuild exceeded 20 seconds" >&2
            exit 1
          fi
      - name: Test
        run: xvfb-run -a ctest --preset debug
